name: Publish Plugin

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Where should this build go?
        type: choice
        options:
          - stable
          - continuous
        default: stable
  push:
    tags:
      - 'v*'
      - '*.*.*'
      - '[0-9]*'
      - 'continuous'

concurrency:
  group: publish-${{ github.event.inputs.channel || github.ref }}
  cancel-in-progress: false

env:
  MODULE: spotube_plugin_spotify

jobs:
  build:
    name: Build .smplug
    runs-on: ubuntu-latest
    outputs:
      plugin-version: ${{ steps.meta.outputs.plugin-version }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write buildkonfig placeholders
        run: |
          for dir in "$MODULE" spotify_gql_client; do
            {
              echo "accessToken=placeholder"
              echo "spDcCookie=placeholder"
              echo "spTCookie=placeholder"
            } > "$dir/local.properties"
          done

      - name: Package production plugin
        run: |
          chmod +x gradlew
          ./gradlew ":$MODULE:packageProductionPlugin"

      - name: Extract plugin version
        id: meta
        run: |
          ver=$(awk '/spotubePlugin[[:space:]]*\{/ { inside = 1 }
                     inside && $1 == "version" { gsub(/"/, "", $3); print $3; exit }' "$MODULE/build.gradle.kts")
          if [ -z "$ver" ]; then
            echo "::error::Could not find version inside spotubePlugin {} block"
            exit 1
          fi
          echo "plugin-version=$ver" >> "$GITHUB_OUTPUT"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: spotify-smplug
          path: ${{ env.MODULE }}/build/distributions/plugin-production.smplug
          if-no-files-found: error

  release:
    name: GitHub release (${{ github.event.inputs.channel || 'tag' }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: spotify-smplug

      - name: Clone repository
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Backport legacy plugin
        run: |
          chmod +x repo/scripts/backport-legacy-plugin.sh
          repo/scripts/backport-legacy-plugin.sh plugin-production.smplug plugin.smplug 0.2.2

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          VERSION: ${{ needs.build.outputs.plugin-version }}
        run: |
          REF_NAME="${GITHUB_REF_NAME:-}"
          if [ "$INPUT_CHANNEL" = "continuous" ] || [ "$REF_NAME" = "continuous" ]; then
            CHANNEL="continuous"
          else
            CHANNEL="stable"
          fi

          if [ "$CHANNEL" = "continuous" ]; then
            # Recreate the continuous tag so it always points at the commit that was just built
            gh release delete continuous --yes --cleanup-tag || true
            gh release create continuous plugin.smplug plugin-production.smplug \
              --target "$GITHUB_SHA" \
              --title "Continuous ($(date -u +%Y-%m-%d))" \
              --notes "Built from ${GITHUB_SHA::7}. Not a stable release." \
              --prerelease
          else
            if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ -n "$REF_NAME" ]; then
              TAG_NAME="$REF_NAME"
            else
              TAG_NAME="${VERSION}"
            fi
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              echo "Release $TAG_NAME exists, uploading assets..."
              gh release upload "$TAG_NAME" plugin.smplug plugin-production.smplug --clobber
            else
              echo "Creating release $TAG_NAME..."
              gh release create "$TAG_NAME" plugin.smplug plugin-production.smplug \
                --target "$GITHUB_SHA" \
                --title "$TAG_NAME" \
                --generate-notes
            fi
          fi
